name: Daily update

on:
  schedule:
    # 22:30 UTC Mon–Fri = after the US close in both summer and winter time
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Fundamentals are slow to fetch, so keep them between runs and refresh the stalest each day
      - uses: actions/cache@v4
        with:
          path: cache
          key: fundamentals-${{ github.run_id }}
          restore-keys: fundamentals-
      - run: python -m kcdt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub emails the repo owner about new issues, so a failed update opens one (and a later success closes it)
  report:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - if: needs.build.result != 'success' || needs.deploy.result != 'success'
        run: |
          open=$(gh issue list --label update-failed --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh label create update-failed --color d73a4a --force
            gh issue create --label update-failed --title "KCDT daily update failed" \
              --body "@${{ github.repository_owner }} 今日自動更新失敗，網站仍然顯示上次嘅數據。Log: $RUN_URL"
          fi
      - if: needs.build.result == 'success' && needs.deploy.result == 'success'
        run: |
          for n in $(gh issue list --label update-failed --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Fixed: $RUN_URL"
          done
