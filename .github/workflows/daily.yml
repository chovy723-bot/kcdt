name: Daily update

on:
  schedule:
    # 22:30 UTC Mon–Fri = after the US close in both summer and winter time
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Fundamentals are slow to fetch, so keep them between runs and refresh the stalest each day
      - uses: actions/cache@v4
        with:
          path: cache
          key: fundamentals-${{ github.run_id }}
          restore-keys: fundamentals-
      - run: python -m kcdt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
