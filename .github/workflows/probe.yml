name: probe
on:
  push:
    branches: [claude/probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for w in thisweek nextweek lastweek; do
            echo "== ff $w"; curl -s -m 30 -A "$UA" "https://nfs.faireconomy.media/ff_calendar_$w.json" -o ff.json -w "%{http_code} %{size_download}\n"
            python3 -c "
          import json
          try: d=json.load(open('ff.json'))
          except Exception as e: print('bad', open('ff.json').read()[:200]); raise SystemExit
          us=[x for x in d if x.get('country')=='USD']; print(len(d), len(us), list(d[0].keys()) if d else None)
          for x in us[:80]: print(json.dumps(x))
          "
          done
