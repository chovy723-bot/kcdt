name: probe
on:
  push:
    branches: [claude/probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: fundamentals-latest
          restore-keys: fundamentals-
      - run: ls cache && cp -r cache app/ && mkdir -p shots && python tools/edgar_test.py
      - name: Save to branch
        if: always()
        run: |
          git config user.name kcdt-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p shots; touch shots/.keep
          git checkout --orphan claude/probe-shots
          git rm -rq --cached . ; git add shots ; git commit -qm "edgar test"
          git push -f origin claude/probe-shots
