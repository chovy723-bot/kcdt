name: probe
on:
  push:
    branches: [claude/probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: |
          python - <<'PY'
          import requests, json
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36","Accept":"application/json"}
          for day in ["2026-10-27","2026-10-28","2026-10-29","2026-10-30"]:
              r=requests.get(f"https://api.nasdaq.com/api/calendar/economicevents?date={day}",headers=UA,timeout=30).json()
              rows=(r.get("data") or {}).get("rows") or []
              print("== econ", day, len(rows), "keys", list(rows[0].keys()) if rows else None)
              for x in rows:
                  if x.get("country")=="United States": print(json.dumps(x, ensure_ascii=False))
          for day in ["2026-10-28","2026-10-29"]:
              r=requests.get(f"https://api.nasdaq.com/api/calendar/earnings?date={day}",headers=UA,timeout=30).json()
              d=r.get("data") or {}
              print("== earn", day, {k:v for k,v in d.items() if k!="rows"}); print(json.dumps((d.get("rows") or [])[:2]))
          PY
