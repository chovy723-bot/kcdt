name: probe
on:
  push:
    branches: [claude/probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - name: probe premarket sources
        run: |
          cat > p.py <<'PY'
          import yfinance as yf
          for t in ["AMZN", "AAPL", "MSFT"]:
              try:
                  e = yf.Ticker(t).get_earnings_dates(limit=4)
                  print("==", t); print(e.to_string()[:600])
              except Exception as x: print(t, "ERR", x)
          PY
          python p.py
