name: Backtest data

# Downloads long price history for backtest/ and commits it to the branch that ran it.
on:
  workflow_dispatch:
  push:
    paths: ["backtest/fetch_history.py", ".github/workflows/backtest-data.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest/fetch_history.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898209+github-actions[bot]@users.noreply.github.com"
          git add backtest/data
          git diff --cached --quiet || git commit -m "Update backtest price history"
          git push
